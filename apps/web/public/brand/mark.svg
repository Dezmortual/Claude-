<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
<title>Proofcast</title>
<defs>
  <linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="8" y1="26" x2="22" y2="5"><stop offset="0" stop-color="#d6457f"/><stop offset="0.45" stop-color="#8a2f68"/><stop offset="1" stop-color="#4a1439"/></linearGradient>
  <linearGradient id="mbg" gradientUnits="userSpaceOnUse" x1="10.5" y1="25" x2="30" y2="8">
    <stop offset="0" stop-color="#e69ac8" stop-opacity="0"/><stop offset=".55" stop-color="#e69ac8" stop-opacity="0.35"/><stop offset="1" stop-color="#e69ac8" stop-opacity="0.122"/></linearGradient>
  <filter id="mglow" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="mbandf" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44"><feGaussianBlur stdDeviation=".7"/></filter>
  <linearGradient id="meg" gradientUnits="userSpaceOnUse" x1="10.5" y1="25" x2="30" y2="8"><stop offset=".15" stop-color="#e69ac8" stop-opacity="0"/><stop offset="1" stop-color="#e69ac8" stop-opacity=".75"/></linearGradient>
  <filter id="mlit" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44" color-interpolation-filters="sRGB">
    <feOffset in="SourceAlpha" dx=".55" dy=".8" result="ho"/>
    <feComposite in="SourceAlpha" in2="ho" operator="out" result="hrim"/>
    <feGaussianBlur in="hrim" stdDeviation=".35" result="hb"/>
    <feFlood flood-color="#ffe2c8" flood-opacity="0.7"/>
    <feComposite in2="hb" operator="in"/>
    <feComposite in2="SourceAlpha" operator="in" result="si"/>
