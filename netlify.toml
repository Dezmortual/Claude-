# Netlify: the app lives in apps/web. Netlify detects Next.js and adds its Next.js adapter itself.
# Environment variables go in the Netlify UI (Site configuration -> Environment variables), scope "Functions":
# variables set in this file reach the build only, not the running app. See replica/deploy.md.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Production deploys run the migrations and the (idempotent) seed first; the scripts use DATABASE_URL_DIRECT when it
# is set. Deploy previews and branch deploys only build: they must never touch the production database.
[context.production]
  command = "npm run db:setup && npm run build"

# Declared explicitly (Netlify normally adds it on its own, but didn't for this site): the adapter that turns the
# Next.js build into Netlify functions. Without it only static files are published and every page is a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
