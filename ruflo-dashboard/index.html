<style>
/* Layout: control-room console. Status strip, then what Ruflo has recorded, then what it ships, filterable down to each item. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --line: #dde2e8;
  --ink: #12161c;
  --ink-2: #4b5562;
  --ink-3: #6f7a88;
  --accent: #1f5fae;
  --series-1: #2a78d6;
  --hover: #eef3fa;
  --good: #0f7b3e;
  --good-bg: #e3f3ea;
  --warn: #8a5a00;
  --warn-bg: #fbf0d6;
  --idle: #4b5562;
  --idle-bg: #e9ecf0;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #181c21; --line: #2b313a; --ink: #eef1f4; --ink-2: #b7c0cb; --ink-3: #8e98a5;
    --accent: #7fb0f0; --series-1: #3987e5; --hover: #1f2630;
    --good: #6fd39a; --good-bg: #16301f; --warn: #f0c060; --warn-bg: #352a10; --idle: #b7c0cb; --idle-bg: #232930;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #181c21; --line: #2b313a; --ink: #eef1f4; --ink-2: #b7c0cb; --ink-3: #8e98a5;
  --accent: #7fb0f0; --series-1: #3987e5; --hover: #1f2630;
  --good: #6fd39a; --good-bg: #16301f; --warn: #f0c060; --warn-bg: #352a10; --idle: #b7c0cb; --idle-bg: #232930;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; letter-spacing: .2px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-2); }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
header .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-3); font-size: 13px; }
.ver { font-family: var(--f-mono); font-size: 13px; color: var(--accent); margin-left: 8px; }

.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.chip svg { width: 12px; height: 12px; flex: none; }
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.idle { color: var(--idle); background: var(--idle-bg); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tile { background: var(--panel); padding: 14px 16px; display: grid; gap: 2px; }
.tile .v { font-family: var(--f-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .6px; }
.tile .s { font-size: 12px; color: var(--ink-3); }
.tile.zero .v { color: var(--ink-3); }
button.tile { border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.tile:hover { background: var(--hover); }
button.tile[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
button.tile:focus-visible, .bar-row:focus-visible, th button:focus-visible, select:focus-visible, input:focus-visible, .pager button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; max-width: 75ch; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.filters label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .6px; }
.filters select, .filters input { font: 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; min-width: 0; }
.filters input { width: min(280px, 100%); }
.filters .count { font-size: 13px; color: var(--ink-3); padding-bottom: 7px; }

.charts { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
@media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }
.bars { display: grid; gap: 2px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 44px; align-items: center; gap: 10px; padding: 3px 4px; border-radius: 3px; outline: none; }
.bar-row:hover, .bar-row:focus-visible { background: var(--hover); }
.bar-row .lab { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 14px; position: relative; }
.bar-row .fill { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .val { font-family: var(--f-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 44px; gap: 10px; padding: 4px 4px 0; font-size: 11px; color: var(--ink-3); }
.axis .ticks { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 3px; font-family: var(--f-mono); }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 14px rgb(0 0 0 / .12); border-radius: 4px; padding: 6px 10px; font-size: 12px; z-index: 10; max-width: 260px; }
.tip strong { display: block; font-family: var(--f-mono); font-size: 15px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; }
th button { all: unset; cursor: pointer; display: block; padding: 8px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-2); }
th button:hover { color: var(--ink); }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.name { font-family: var(--f-mono); white-space: nowrap; }
td.desc { color: var(--ink-2); min-width: 280px; }
tr:hover td { background: var(--hover); }
.type { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 13px; color: var(--ink-3); }
.pager button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.pager button:disabled { opacity: .4; cursor: default; }
footer { font-size: 12px; color: var(--ink-3); }
footer code { font-family: var(--f-mono); }
@media (prefers-reduced-motion: no-preference) { .bar-row .fill { transition: width .25s ease; } }
</style>

<div class="wrap">
  <header>
    <h1>Ruflo Activity<span class="ver" id="ver"></span></h1>
    <div class="meta"><span id="installed"></span><span id="generated"></span></div>
  </header>

  <div class="strip" id="strip" aria-label="Ruflo status"></div>

  <section class="panel" aria-labelledby="act-h">
    <div class="panel-head"><h2 id="act-h">Recorded so far</h2><span class="muted mono" id="session"></span></div>
    <div class="tiles" id="activity"></div>
    <p class="note" id="act-note"></p>
  </section>

  <section aria-labelledby="inv-h" style="display:grid;gap:12px">
    <h2 id="inv-h">What Ruflo adds to Claude Code</h2>
    <div class="tiles" id="inventory" role="group" aria-label="Filter by type"></div>
  </section>

  <div class="filters" role="search">
    <label for="f-type">Type
      <select id="f-type"><option value="all">All types</option></select>
    </label>
    <label for="f-group">Group
      <select id="f-group"><option value="all">All groups</option></select>
    </label>
    <label for="f-q">Search
      <input id="f-q" type="search" placeholder="Name or description">
    </label>
    <span class="count" id="count"></span>
  </div>

  <div class="charts">
    <section class="panel" aria-labelledby="grp-h">
      <div class="panel-head"><h2 id="grp-h">Items by group</h2><span class="muted" id="grp-sub"></span></div>
      <div class="bars" id="groups"></div>
      <div class="axis" aria-hidden="true"><span></span><div class="ticks" id="grp-ticks"></div><span></span></div>
    </section>
    <section class="panel" aria-labelledby="hk-h">
      <div class="panel-head"><h2 id="hk-h">Hook handlers by event</h2><span class="muted" id="hk-sub"></span></div>
      <div class="bars" id="hooks"></div>
      <div class="axis" aria-hidden="true"><span></span><div class="ticks" id="hk-ticks"></div><span></span></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="tbl-h">
    <div class="panel-head"><h2 id="tbl-h">Every item</h2><span class="muted">Click a column to sort</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th><button data-sort="type">Type</button></th>
          <th><button data-sort="name">Name</button></th>
          <th><button data-sort="group">Group</button></th>
          <th><button data-sort="desc">Description</button></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager"><span id="page-info"></span><button id="prev">Previous</button><button id="next">Next</button></div>
  </section>

  <footer>Built from this repo's <code>.claude/</code>, <code>.claude-flow/</code> and <code>.swarm/</code> plus the claude-flow MCP server's tool list. Rebuild with <code>python3 ruflo-dashboard/build.py</code>.</footer>
</div>
<div class="tip" id="tip" hidden></div>

 security-detection harness against a 10-vuln/9-decoy ground-truth corpus and grades on TPR/FPR/patch-pass/repro/unsafe vs four baselines (B0 static, B1 LLM-single-pass"},{"type":"MCP tool","name":"metaharness_bench","group":"metaharness","desc":"ADR-153 supporting verb \u2014 create or verify bench suites used by metaharness_evolve --bench. Bench suites are JSON files of {input, expectedOutput, weight} tasks; scoring against a fixed corpus decouples evolution from flaky/slow/undersized "},{"type":"MCP tool","name":"metaharness_redblue","group":"metaharness","desc":"Adversarial red/blue LLM testing via @metaharness/redblue \u2014 generates attacks across OWASP LLM Top-10 / NIST AI RMF families (prompt injection, tool misuse, data leakage, jailbreaks, denial-of-wallet), runs them against an LLM target YOU OW"},{"type":"MCP tool","name":"metaharness_learn","group":"metaharness","desc":"ADR-235 (upstream) \u2014 GEPA learning run via `metaharness learn`: optimizes a harness genome against a SWE-bench-style slice manifest. $0 DRY-RUN BY DEFAULT \u2014 it resolves the slice and prices the run without model calls; pass run=true to actu"},{"type":"MCP tool","name":"metaharness_gepa","group":"metaharness","desc":"GEPA genome operations from the `@metaharness/darwin/gepa` library entry (darwin 0.8.0). op=genome loads + validates a genome (default: the shipped cand-6 \u2014 first holdout-confirmed cheap-tier policy promotion, provenance in the package); op"},{"type":"MCP tool","name":"metaharness_flywheel","group":"metaharness","desc":"ADR-322 \u2014 evaluate candidates into immutable receipts, inspect the append-only promotion ledger, and explicitly promote one signed receipt with atomic compare-and-swap semantics. Use when running governed flywheel evaluation or promotion; e"},{"type":"MCP tool","name":"agenticow_branch","group":"agenticow","desc":"agenticow@~0.2.3 \u2014 COW-fork a base .rvf memory file. Measured 162-byte branches regardless of base size (verified at N=1k/10k/50k). Use when you need per-Darwin-iteration / per-user / per-session memory personalization. Copying the parent ."},{"type":"MCP tool","name":"agenticow_ingest","group":"agenticow","desc":"agenticow \u2014 write vectors (with optional text payloads) into an .rvf memory branch or base. Records: [{id?, vector, text?}] \u2014 id auto-assigns when omitted. This is the write half that makes a branch usable: agenticow_branch creates an empty"},{"type":"MCP tool","name":"agenticow_query","group":"agenticow","desc":"agenticow \u2014 k-NN read across an .rvf memory branch's full COW lineage (parent \u222a edits, child wins), returning {id, distance, branch, text}. Read-only (no manifest write). The `branch` field on each hit tells you which lineage node the resul"},{"type":"MCP tool","name":"agenticow_diff","group":"agenticow","desc":"agenticow \u2014 show what a branch changed relative to its lineage: {added, overridden, deleted} vector-id lists. Use when you are about to promote and want to preview the exact merge, or when auditing what a branch actually wrote. Diffing by r"},{"type":"MCP tool","name":"agenticow_lineage","group":"agenticow","desc":"agenticow \u2014 walk the COW chain of an .rvf memory file: an ordered list of nodes (role working|checkpoint|base, id, label, parent, createdAt, mutations, tombstones). Use when you need branch history \u2014 to find checkpoint ids for a targeted ro"},{"type":"MCP tool","name":"agenticow_status","group":"agenticow","desc":"agenticow \u2014 health/geometry of an .rvf memory file: {totalVectors, totalSegments, fileSize, currentEpoch, deadSpaceRatio, readOnly, chainDepth, dimension, metric}. Use when you need to check vector count before/after ingest, spot compaction"},{"type":"MCP tool","name":"agenticow_checkpoint","group":"agenticow","desc":"agenticow \u2014 freeze a labelled restore point on an .rvf memory file. Subsequent edits stay in a fresh COW child; rollback returns here. Use when you are about to run an experimental Darwin tick or speculative agent edit that may need to be d"},{"type":"MCP tool","name":"agenticow_rollback","group":"agenticow","desc":"agenticow \u2014 discard all edits since the most recent checkpoint on an .rvf memory file. Reuses a fresh COW child derived from the checkpoint. Use when a Darwin tick or agent experiment regressed and you want to revert memory state without re"},{"type":"MCP tool","name":"agenticow_promote","group":"agenticow","desc":"agenticow \u2014 merge a branch's edits back into its base (or an explicit target) memory file. After promote, branch edits become part of base lineage. Use when a per-user / per-Darwin-iteration branch has been validated and should graduate to "},{"type":"MCP tool","name":"agenticow_speculate","group":"agenticow","desc":"agenticow \u2014 speculative branch-and-promote for parallel A/B memory exploration. Forks a 162-byte COW branch per candidate off a shared base .rvf, ingests each candidate's vectors into its OWN isolated branch, scores every branch (probe-quer"},{"type":"MCP tool","name":"federation_bbs_register","group":"federation","desc":"agentbbs@~0.1.0 \u2014 Register a BBS room as a named federation peer (ADR-164 Phase 1). Maps a business-domain label like \"#sales\" or \"#finance\" to a stable roomId and emits an attested PeerHello envelope. Use when you are scaffolding the busin"},{"type":"MCP tool","name":"federation_bbs_publish","group":"federation","desc":"agentbbs \u2014 Publish a domain event from a pod agent to a BBS room (ADR-164 Phase 1). Wraps the payload in a ReplicateMessage envelope (envelopeId, seq, ts, msgType, payload) and appends it to the room log. Use when an agent has produced a ty"},{"type":"MCP tool","name":"federation_bbs_watch","group":"federation","desc":"agentbbs \u2014 Poll recent envelopes from a BBS room (ADR-164 Phase 1). Returns envelopes newer than the optional sinceEnvelopeId, up to limit. Use when a pod agent needs to see incoming human overrides, new tasks, or peer events posted to its "},{"type":"MCP tool","name":"federation_bbs_human_join","group":"federation","desc":"agentbbs \u2014 Mint a single-use Ed25519-signed token a human business owner presents to the agentbbs SSH/web front door to join a room (ADR-164 \u00a73.2.4). Returns webUrl + sshCommand + handshakeToken + expiresAt. Use when the cockpit operator ne"},{"type":"MCP tool","name":"federation_bbs_identity","group":"federation","desc":"agentbbs Phase 2 \u2014 return this host's persistent federation node identity (nodeId + Ed25519 public key), creating it on first call. Give the nodeId and publicKey to a peer so they can pin you with federation_bbs_peer_add. The private key ne"},{"type":"MCP tool","name":"federation_bbs_peer_add","group":"federation","desc":"agentbbs Phase 2 \u2014 pin a remote federation peer by nodeId, URL and Ed25519 public key. The key is pinned at add time and every envelope merged from this peer is verified against it, so a hostile peer cannot forge another node's envelopes. R"},{"type":"MCP tool","name":"federation_bbs_peers","group":"federation","desc":"agentbbs Phase 2 \u2014 list pinned federation peers with last-sync state. Public keys are returned so an operator can compare a pin against what the peer reports; private material is never included. Use when you want to audit who this host will"},{"type":"MCP tool","name":"federation_bbs_serve","group":"federation","desc":"agentbbs Phase 2 \u2014 start the read-only pull endpoint peers fetch from (GET /agentbbs/v1/rooms/:roomId/envelopes). Binds 127.0.0.1 unless bindHost is given explicitly, so room contents are never exposed on a routable interface by accident. T"},{"type":"MCP tool","name":"federation_bbs_sync","group":"federation","desc":"agentbbs Phase 2 \u2014 pull a room from pinned peers and union-merge what verifies. Merge is keyed on envelopeId so it is idempotent and order-independent; unsigned, misattributed, oversize and over-hop (>8) envelopes are dropped and counted ra"},{"type":"MCP tool","name":"x_federation_sync","group":"x","desc":"Fetch recent signature-verified coordination messages from the open x.ruv.io swarm federation (Nostr, #t=ruflo-swarm). Use when you need to see what other ruflo nodes across the internet have posted (PeerHello/Status/Task/Result/Claim*). Re"},{"type":"MCP tool","name":"x_federation_roster","group":"x","desc":"List nodes currently announcing themselves on the open swarm (recent PeerHello events) via the ruv://swarm/roster resource. Use when you need to know who is online across the federation before assigning work. Grepping sync output by hand is"},{"type":"MCP tool","name":"x_federation_claims","group":"x","desc":"Return the current owner-per-resource work-claims ledger for the open swarm (ruv://claims/board). Use when you are about to start shared work and need to know whether a resourceId is already owned. Inferring ownership from raw ClaimIssued e"},{"type":"MCP tool","name":"x_federation_registry","group":"x","desc":"Read the federation registry resource (ruv://federation/registry): relay URL, canonical relay tag for NIP-42, gateway pubkey, and the exact self-join steps. Use when onboarding a new node or user to the open federation. Hard-coding the rela"},{"type":"MCP tool","name":"x_federation_publish","group":"x","desc":"Publish a signed coordination message to the open swarm AS THE GATEWAY identity (Status/Task/Result/\u2026). Requires RUFLO_X_ADMIN_TOKEN. Use when a trusted operator needs a hub-level broadcast. Using this to post on behalf of an individual nod"},{"type":"MCP tool","name":"x_federation_invite_mint","group":"x","desc":"Mint a use-limited, expiring invite code so a new ruflo user can self-join the open federation with THEIR OWN key. Requires RUFLO_X_ADMIN_TOKEN. Use when onboarding someone. Sharing the relay owner key instead is wrong because invites are r"},{"type":"MCP tool","name":"x_federation_admit","group":"x","desc":"Admit a Nostr pubkey as a relay member directly (NIP-43 kind 9030). Requires RUFLO_X_ADMIN_TOKEN. Use when a known node reports its 64-hex pubkey and you want to skip the invite step. Padding or hand-editing a reported pubkey is wrong becau"},{"type":"MCP tool","name":"seraphina_guidance","group":"seraphina","desc":"Ask Seraphina \u2014 the swarm queen / primary coordinator \u2014 for coordination guidance on a goal. She reads the live open-federation roster, claims board and recent messages from x.ruv.io, reasons through the cognitum meta-llm gateway (cost-gove"},{"type":"MCP tool","name":"x_federation_join","group":"x","desc":"Join the federation with YOUR OWN local key, without an invite when public registration is enabled. Reuses ~/.ruflo/nostr.key (0600), proves key ownership with NIP-98, and verifies membership with NIP-42. Use when a user wants to join as th"},{"type":"MCP tool","name":"x_federation_channel_create","group":"x","desc":"Create a swarm channel. visibility=public gives a named stream every relay member can read (pub:<name>). visibility=private generates a 32-byte key HERE, stores it at ~/.ruflo/channels.json (0600), and returns an opaque id (prv:<hex>) that "},{"type":"MCP tool","name":"x_federation_channel_grant","group":"x","desc":"Grant a member access to a private channel by sealing its key to their pubkey with NIP-44 (ECDH), published as a ChannelGrant event only they can open. Use when adding a participant to an existing private channel. Publishing the raw key int"},{"type":"MCP tool","name":"x_federation_channel_accept","group":"x","desc":"Accept private-channel grants addressed to your key: finds ChannelGrant events tagged to your pubkey, opens each with your own secret key, and caches the channel keys locally. Use when someone tells you they granted you a channel. Asking th"},{"type":"MCP tool","name":"x_federation_channel_publish","group":"x","desc":"Publish a message to a channel with YOUR OWN key. A private channel is encrypted locally under its channel key before it leaves this machine, and the message type is hidden behind k=enc so the relay sees only an opaque id and ciphertext. Us"},{"type":"MCP tool","name":"x_federation_channel_read","group":"x","desc":"Read a channel and decrypt what your keys can open. Public messages come back as JSON; private ones are decrypted locally with the cached channel key, and anything you have no key for is returned as encrypted:true rather than silently dropp"},{"type":"MCP tool","name":"x_federation_channel_list","group":"x","desc":"List the private channels this machine holds keys for, plus their local labels. Use when you want to know what you can actually read before calling channel_read. The gateway channel_list is the wrong tool for that: it reports channels seen "},{"type":"MCP tool","name":"business_pod_validate","group":"business","desc":"ADR-164 Phase 2 \u2014 Validate a business-pod template JSON against the schema in ADR-164 \u00a73.3 (name, agents[], allowedMcpTools, bench, piiPolicy, budgets, cronSchedule, auditReadView, reservationExpiryMs bounded by ADR-164.1 \u00a73.2). Use when a "},{"type":"MCP tool","name":"business_pod_route_backend","group":"business","desc":"ADR-164 Phase 3 \u2014 Compute the domain-affinity routing decision for a business pod per ADR-164 \u00a73.4 and return {backend, reason}. The three backends are local-stdio (preferLocalExecution=true), cloud-managed (preferLocalExecution=false AND b"},{"type":"MCP tool","name":"http_fetch","group":"http","desc":"ADR-164 \u00a75.1.8 \u2014 HTTP probe primitive for business-pod ops benches (synthetic 200/500 endpoint checks, third-party status pages). Default-secure: blocks file://, ftp://, RFC-1918 / loopback / link-local hosts unless CLAUDE_FLOW_HTTP_FETCH_A"},{"type":"MCP tool","name":"mission_create","group":"mission","desc":"Create a draft mission (objective only), idempotent per requestId. Use when starting governed multi-step work that several clients (CLI, MCP, the Claude Code workbench) must observe and control through one durable record. task_create is wro"},{"type":"MCP tool","name":"mission_plan","group":"mission","desc":"Submit or revise a mission plan: acyclic task graph, acceptance criteria and budget ceiling in integer minor units. Use when a mission needs a reviewable plan before any authorization or admission. Editing plan state through memory_store is"},{"type":"MCP tool","name":"mission_get","group":"mission","desc":"Read one mission (record, plan, budget, tasks, evidence, executor observation) or list missions; read only. Use when you need the authoritative current state of a mission before acting on it. Inferring state from task_status or a UI badge i"},{"type":"MCP tool","name":"mission_events","group":"mission","desc":"Read mission events after a durable cursor (afterSequence). Use when resuming or reconnecting a client and you need exactly what changed since your last sequence. Re-reading mission_get in a loop is wrong because it loses the transition his"},{"type":"MCP tool","name":"mission_request_action","group":"mission","desc":"Request a scoped mission control action: requestAuthorization, pause or cancel (admit and resume report executor-unavailable until a durable executor is admitted). Use when a person or agent wants a running or planned mission to change cour"}],"activity":{"session":"session-1791675856214","sessionStarted":"2026-10-10T23:44:16.214Z","edits":3,"commands":0,"tasks":0,"errors":0,"insights":3,"memoryEntries":0,"patterns":0,"trajectories":0,"routingDecisions":0,"sessionsTotal":0,"swarmActive":false,"agentsActive":0,"maxAgents":15,"topology":"hierarchical-mesh","securityStatus":"PENDING","lastScan":null}};
const $ = id => document.getElementById(id);
const TYPES = ["Skill", "Command", "Agent", "MCP tool"];
const PLURAL = {"Skill": "Skills", "Command": "Commands", "Agent": "Agents", "MCP tool": "MCP tools"};
const fmt = n => Number(n).toLocaleString();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ICON = {
  good: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5L11 10.5H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 5v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  idle: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'
};

const state = { type: "all", group: "all", q: "", sort: "type", dir: 1, page: 0 };
try { const t = localStorage.getItem("ruflo-dash-type"); if (t && (t === "all" || TYPES.includes(t))) state.type = t; } catch (e) {}

function header() {
  $("ver").textContent = "v" + DATA.version;
  $("installed").textContent = DATA.installed ? "Installed " + DATA.installed : "";
  $("generated").textContent = "Data as of " + DATA.generated;
  const a = DATA.activity, hookCount = Object.values(DATA.hooks).reduce((s, v) => s + v, 0);
  const tools = DATA.items.filter(i => i.type === "MCP tool").length;
  const chips = [
    ["good", `Hooks wired: ${hookCount} handlers on ${Object.keys(DATA.hooks).length} events`],
    [tools ? "good" : "warn", tools ? `MCP server answers: ${fmt(tools)} tools` : "MCP server did not answer"],
    [DATA.statusLine ? "good" : "idle", DATA.statusLine ? "Status line on" : "Status line off"],
    [a.swarmActive ? "good" : "idle", a.swarmActive ? `Swarm running: ${a.agentsActive}/${a.maxAgents} agents` : `Swarm idle: 0/${a.maxAgents} agents, ${a.topology}`],
    [a.securityStatus === "PENDING" ? "warn" : "good", a.lastScan ? `Security scan: ${a.securityStatus.toLowerCase()}` : "Security scan not run yet"],
    ["good", `${DATA.plugins.length} plugins enabled`]
  ];
  const strip = $("strip");
  chips.forEach(([kind, text]) => { const c = el("span", "chip " + kind); c.innerHTML = ICON[kind]; c.append(document.createTextNode(text)); strip.append(c); });
}

function activity() {
  const a = DATA.activity;
  $("session").textContent = a.session ? a.session : "";
  const tiles = [
    ["Edits tracked", a.edits, "this session"],
    ["Insights queued", a.insights, "waiting to be learned"],
    ["Memory entries", a.memoryEntries, ".swarm/memory.db"],
    ["Patterns learned", a.patterns, "from finished tasks"],
    ["Routing decisions", a.routingDecisions, "agent picks saved"],
    ["Sessions completed", a.sessionsTotal, "closed by SessionEnd"]
  ];
  const box = $("activity");
  tiles.forEach(([l, v, s]) => {
    const t = el("div", "tile" + (v ? "" : " zero"));
    t.append(el("span", "l", l), el("span", "v", fmt(v)), el("span", "s", s));
    box.append(t);
  });
  const total = tiles.reduce((s, t) => s + t[1], 0);
  $("act-note").textContent = total < 5
    ? "Ruflo was installed during this session, so it has barely started recording. Hooks log edits, commands and tasks as you work; memory, patterns and routing fill in once sessions end and the daemon runs (npx ruflo daemon start). Rebuild this page to see them grow."
    : "Counts since Ruflo was installed. Rebuild this page to refresh them.";
}

function inventory() {
  const box = $("inventory");
  const sel = $("f-type");
  TYPES.forEach(t => {
    const n = DATA.items.filter(i => i.type === t).length;
    const b = el("button", "tile");
    b.dataset.type = t;
    b.append(el("span", "l", PLURAL[t]), el("span", "v", fmt(n)), el("span", "s", "Show in table"));
    b.addEventListener("click", () => setType(state.type === t ? "all" : t));
    box.append(b);
    const o = el("option", null, PLURAL[t]); o.value = t; sel.append(o);
  });
}

function setType(t) {
  state.type = t; state.group = "all"; state.page = 0;
  try { localStorage.setItem("ruflo-dash-type", t); } catch (e) {}
  render();
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter(i =>
    (state.type === "all" || i.type === state.type) &&
    (state.group === "all" || i.group === state.group) &&
    (!q || i.name.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)));
}

function niceMax(m) {
  if (m <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

const tip = $("tip");
function showTip(e, value, label, extra) {
  tip.replaceChildren(el("strong", null, value), el("span", null, label));
  if (extra) tip.append(el("div", "muted", extra));
  tip.hidden = false;
  const r = e.currentTarget.getBoundingClientRect();
  const x = e.clientX ?? (r.left + r.width / 2), y = e.clientY ?? r.top;
  tip.style.left = Math.min(x + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + "px";
}

function bars(boxId, ticksId, rows, unit, onPick) {
  const box = $(boxId); box.replaceChildren();
  const max = niceMax(Math.max(1, ...rows.map(r => r[1])));
  rows.forEach(([label, v, extra]) => {
    const r = el("div", "bar-row"); r.tabIndex = 0;
    r.setAttribute("aria-label", `${label}: ${v} ${unit}`);
    const track = el("div", "track"), fill = el("div", "fill");
    fill.style.width = (v / max * 100) + "%"; track.append(fill);
    r.append(el("span", "lab", label), track, el("span", "val", fmt(v)));
    const show = e => showTip(e, fmt(v) + " " + unit, label, extra);
    r.addEventListener("pointermove", show); r.addEventListener("focus", show);
    r.addEventListener("pointerleave", () => tip.hidden = true); r.addEventListener("blur", () => tip.hidden = true);
    if (onPick) { r.style.cursor = "pointer"; r.addEventListener("click", () => onPick(label)); r.addEventListener("keydown", e => { if (e.key === "Enter") onPick(label); }); }
    box.append(r);
  });
  const ticks = $(ticksId); ticks.replaceChildren();
  (max % 2 ? [0, max] : [0, max / 2, max]).forEach(t => ticks.append(el("span", null, fmt(t))));
}

function renderGroups(items) {
  if (state.type === "all" && state.group === "all") {
    $("grp-h").textContent = "Items by type";
    $("grp-sub").textContent = "Click a bar to see its groups";
    const rows = TYPES.map(t => [PLURAL[t], items.filter(i => i.type === t).length]).filter(r => r[1]);
    bars("groups", "grp-ticks", rows, "items", label => setType(TYPES.find(t => PLURAL[t] === label)));
    return;
  }
  $("grp-h").textContent = "Items by group";
  const c = {};
  items.forEach(i => c[i.group] = (c[i.group] || 0) + 1);
  let rows = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const TOP = 12;
  if (rows.length > TOP + 1) {
    const rest = rows.slice(TOP);
    rows = rows.slice(0, TOP).concat([["Other (" + rest.length + " groups)", rest.reduce((s, r) => s + r[1], 0), rest.map(r => r[0]).join(", ")]]);
  }
  $("grp-sub").textContent = state.type === "all" ? "All types" : PLURAL[state.type];
  bars("groups", "grp-ticks", rows, "items", g => { if (!g.startsWith("Other (")) { state.group = g; state.page = 0; render(); } });
}

function renderHooks() {
  const rows = Object.entries(DATA.hooks).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  $("hk-sub").textContent = "from .claude/settings.json";
  bars("hooks", "hk-ticks", rows, "handlers");
}

function renderGroupOptions() {
  const sel = $("f-group");
  const groups = [...new Set(DATA.items.filter(i => state.type === "all" || i.type === state.type).map(i => i.group))].sort();
  sel.replaceChildren(Object.assign(el("option", null, "All groups"), { value: "all" }));
  groups.forEach(g => { const o = el("option", null, g); o.value = g; sel.append(o); });
  if (!groups.includes(state.group)) state.group = "all";
  sel.value = state.group;
}

const PAGE = 50;
function renderTable(items) {
  const k = state.sort, d = state.dir;
  const sorted = [...items].sort((a, b) => d * (a[k].localeCompare(b[k]) || a.name.localeCompare(b.name)));
  const pages = Math.max(1, Math.ceil(sorted.length / PAGE));
  state.page = Math.min(state.page, pages - 1);
  const body = $("rows"); body.replaceChildren();
  sorted.slice(state.page * PAGE, state.page * PAGE + PAGE).forEach(i => {
    const tr = el("tr");
    tr.append(el("td", "type", i.type), el("td", "name", i.name), el("td", null, i.group), el("td", "desc", i.desc || "—"));
    body.append(tr);
  });
  if (!sorted.length) { const tr = el("tr"), td = el("td", "muted", "Nothing matches. Clear the search or pick another type."); td.colSpan = 4; tr.append(td); body.append(tr); }
  const from = sorted.length ? state.page * PAGE + 1 : 0, to = Math.min(sorted.length, (state.page + 1) * PAGE);
  $("page-info").textContent = `${fmt(from)}–${fmt(to)} of ${fmt(sorted.length)}`;
  $("prev").disabled = state.page === 0; $("next").disabled = state.page >= pages - 1;
  document.querySelectorAll("th button").forEach(b => {
    const on = b.dataset.sort === k;
    b.textContent = b.textContent.replace(/ [▲▼]$/, "") + (on ? (d > 0 ? " ▲" : " ▼") : "");
    b.closest("th").setAttribute("aria-sort", on ? (d > 0 ? "ascending" : "descending") : "none");
  });
}

function render() {
  $("f-type").value = state.type;
  document.querySelectorAll("#inventory .tile").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.type === state.type)));
  renderGroupOptions();
  const items = filtered();
  $("count").textContent = `${fmt(items.length)} of ${fmt(DATA.items.length)} items`;
  renderGroups(items);
  renderTable(items);
}

header(); activity(); inventory(); renderHooks();
$("f-type").addEventListener("change", e => setType(e.target.value));
$("f-group").addEventListener("change", e => { state.group = e.target.value; state.page = 0; render(); });
$("f-q").addEventListener("input", e => { state.q = e.target.value; state.page = 0; render(); });
document.querySelectorAll("th button").forEach(b => b.addEventListener("click", () => {
  if (state.sort === b.dataset.sort) state.dir *= -1; else { state.sort = b.dataset.sort; state.dir = 1; }
  render();
}));
$("prev").addEventListener("click", () => { state.page--; render(); });
$("next").addEventListener("click", () => { state.page++; render(); });
render();
</script>
