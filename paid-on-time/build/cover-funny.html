<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paid On Time cover</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--o:#FF7A00;--os:#FFF1E4;--ink:#141414;--m:#4a4a4a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ddd;padding:20px;font-family:Poppins,system-ui,sans-serif;color:var(--ink)}
  .cover{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:center}
  .cover:before{content:"";position:absolute;right:-120px;top:-160px;width:900px;height:900px;border-radius:50%;background:var(--os)}
  .l{position:relative;flex:0 0 520px;padding-left:70px}
  h1{color:var(--o);font-weight:900;font-size:112px;line-height:.95;letter-spacing:-5px}
  .tag{font-size:31px;font-weight:600;margin-top:24px;line-height:1.3}
  .tag span{color:var(--o)}
  .chips{display:flex;gap:8px;flex-wrap:nowrap;margin-top:28px}
  .chip{background:var(--ink);color:#fff;font-weight:700;border-radius:30px;padding:7px 14px;font-size:17px;white-space:nowrap}
  svg.scene{position:relative;width:760px;height:720px;flex:none}
  .bub{font-family:Poppins,system-ui,sans-serif;font-weight:800}
</style></head><body>
<div class="cover">
  <div class="l">
    <h1>Paid On<br>Time.</h1>
    <div class="tag">Make your invoices<br><span>stop running away.</span></div>
    <div class="chips"><span class="chip">App</span><span class="chip">Tracker</span><span class="chip">12 scripts</span><span class="chip">Playbook</span></div>
  </div>

  <svg class="scene" viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="none"/>
    </defs>
    <!-- ground -->
    <path d="M0 610 H760" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="230" cy="612" rx="110" ry="12" fill="#000" opacity=".08"/>
    <ellipse cx="575" cy="612" rx="90" ry="11" fill="#000" opacity=".08"/>

    <!-- dust clouds -->
    <g fill="#fff" stroke="#141414" stroke-width="4">
      <circle cx="95" cy="585" r="18"/><circle cx="70" cy="595" r="13"/><circle cx="118" cy="597" r="11"/>
      <circle cx="470" cy="590" r="15"/><circle cx="448" cy="598" r="10"/>
    </g>

    <!-- ===== FREELANCER (chasing, running right) ===== -->
    <g stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
      <!-- back leg -->
      <path d="M205 440 L150 505 L95 540" stroke-width="26" fill="none" stroke="#2b2d42"/>
      <path d="M205 440 L150 505 L95 540" stroke-width="5" fill="none" opacity="0"/>
      <ellipse cx="88" cy="548" rx="26" ry="14" fill="#141414" transform="rotate(-30 88 548)" stroke="none"/>
      <!-- front leg -->
      <path d="M210 440 L270 505 L285 588" stroke-width="26" fill="none" stroke="#2b2d42"/>
      <ellipse cx="300" cy="594" rx="30" ry="14" fill="#141414" stroke="none"/>
      <!-- back arm -->
      <path d="M215 330 L160 375 L130 340" stroke-width="20" fill="none" stroke="#8d5a3b"/>
      <!-- torso (orange tee) -->
      <path d="M232 300 L205 445" stroke-width="64" stroke="#FF7A00" fill="none"/>
      <!-- head -->
      <circle cx="248" cy="240" r="50" fill="#8d5a3b" stroke-width="5"/>
      <!-- hair -->
      <path d="M200 232 C198 180 260 168 296 205 C285 196 262 195 250 205 C238 192 215 200 200 232 Z" fill="#141414" stroke-width="4"/>
      <!-- sweat -->
      <path d="M192 215 C182 228 186 238 194 238 C202 238 204 228 192 215 Z" fill="#7cc6ff" stroke-width="3"/>
      <path d="M180 250 C172 260 175 268 181 268 C187 268 189 260 180 250 Z" fill="#7cc6ff" stroke-width="3"/>
      <!-- eyes: determined, looking right -->
      <circle cx="262" cy="236" r="9" fill="#fff" stroke-width="3"/><circle cx="266" cy="237" r="4.5" fill="#141414" stroke="none"/>
      <circle cx="290" cy="236" r="9" fill="#fff" stroke-width="3"/><circle cx="294" cy="237" r="4.5" fill="#141414" stroke="none"/>
      <path d="M252 220 L272 226 M282 226 L300 219" stroke-width="5" fill="none"/>
      <!-- yelling mouth -->
      <path d="M268 262 Q284 258 294 266 Q288 284 272 280 Z" fill="#7a1f1f" stroke-width="4"/>
      <!-- front arm holding net -->
      <path d="M240 320 L292 352 L330 322" stroke-width="20" fill="none" stroke="#8d5a3b"/>
      <!-- net handle -->
      <path d="M318 336 L470 222" stroke-width="9" stroke="#b07a3c"/>
      <!-- net hoop + mesh -->
      <g transform="rotate(-28 505 196)">
        <path d="M465 196 Q505 290 545 196" fill="#ffffff" fill-opacity=".6" stroke-width="4"/>
        <path d="M478 196 Q492 250 505 262 M492 196 Q500 240 520 250 M520 196 Q512 238 498 255 M533 196 Q520 238 510 262" stroke-width="2" fill="none" opacity=".7"/>
        <ellipse cx="505" cy="196" rx="42" ry="13" fill="none" stroke-width="6"/>
      </g>
      <!-- hand -->
      <circle cx="322" cy="332" r="13" fill="#8d5a3b" stroke-width="4"/>
    </g>

    <!-- motion lines behind invoice -->
    <g stroke="#141414" stroke-width="5" stroke-linecap="round" opacity=".35">
      <path d="M455 330 H505"/><path d="M440 380 H500"/><path d="M460 430 H505"/>
    </g>

    <!-- ===== INVOICE (running away, right) ===== -->
    <g stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
      <!-- legs -->
      <path d="M560 470 L530 530 L505 585" stroke-width="12" fill="none"/>
      <path d="M612 470 L650 525 L690 548" stroke-width="12" fill="none"/>
      <ellipse cx="498" cy="592" rx="22" ry="11" fill="#FF7A00" stroke-width="4"/>
      <ellipse cx="700" cy="554" rx="22" ry="11" fill="#FF7A00" stroke-width="4" transform="rotate(-20 700 554)"/>
      <!-- arms flailing -->
      <path d="M528 360 L490 320 L470 290" stroke-width="10" fill="none"/>
      <path d="M660 350 L705 318 L720 280" stroke-width="10" fill="none"/>
      <circle cx="468" cy="285" r="10" fill="#fff" stroke-width="4"/>
      <circle cx="722" cy="275" r="10" fill="#fff" stroke-width="4"/>

      <g transform="rotate(9 595 370)">
        <!-- paper -->
        <path d="M525 270 H640 L668 298 V475 H525 Z" fill="#fff" stroke-width="6"/>
        <path d="M640 270 V298 H668" fill="#eee" stroke-width="5"/>
        <!-- content -->
        <text x="540" y="304" font-family="Poppins,system-ui,sans-serif" font-weight="800" font-size="20" fill="#141414" stroke="none">INVOICE</text>
        <path d="M540 418 H650 M540 436 H620 M540 454 H640" stroke-width="4" opacity=".25"/>
        <!-- face -->
        <circle cx="568" cy="345" r="17" fill="#fff" stroke-width="4"/>
        <circle cx="612" cy="345" r="17" fill="#fff" stroke-width="4"/>
        <circle cx="560" cy="344" r="7" fill="#141414" stroke="none"/>
        <circle cx="604" cy="344" r="7" fill="#141414" stroke="none"/>
        <path d="M552 322 L578 316 M600 316 L626 322" stroke-width="4" fill="none"/>
        <ellipse cx="590" cy="388" rx="13" ry="16" fill="#7a1f1f" stroke-width="4"/>
        <!-- stamp -->
        <g transform="rotate(-14 596 420)">
          <rect x="535" y="400" width="124" height="38" rx="6" fill="none" stroke="#d92d20" stroke-width="5"/>
          <text x="597" y="428" text-anchor="middle" font-family="Poppins,system-ui,sans-serif" font-weight="900" font-size="22" fill="#d92d20" stroke="none" letter-spacing="1">OVERDUE</text>
        </g>
      </g>
      <!-- panic sweat -->
      <path d="M690 250 C680 263 684 273 692 273 C700 273 702 263 690 250 Z" fill="#7cc6ff" stroke-width="3"/>
      <path d="M520 240 C512 251 515 259 521 259 C527 259 529 251 520 240 Z" fill="#7cc6ff" stroke-width="3"/>
    </g>

    <!-- speech bubbles -->
    <g stroke="#141414" stroke-width="5" stroke-linejoin="round">
      <path d="M40 60 H330 Q345 60 345 75 V135 Q345 150 330 150 H245 L225 182 L215 150 H40 Q25 150 25 135 V75 Q25 60 40 60 Z" fill="#fff"/>
      <path d="M440 70 H735 Q750 70 750 85 V145 Q750 160 735 160 H640 L612 198 L615 160 H440 Q425 160 425 145 V85 Q425 70 440 70 Z" fill="#FF7A00"/>
    </g>
    <text class="bub" x="185" y="97" text-anchor="middle" font-size="25" fill="#141414">IT'S BEEN</text>
    <text class="bub" x="185" y="133" text-anchor="middle" font-size="30" fill="#141414">47 DAYS!!</text>
    <text class="bub" x="588" y="107" text-anchor="middle" font-size="25" fill="#fff">Paying next week,</text>
    <text class="bub" x="588" y="142" text-anchor="middle" font-size="25" fill="#fff">I promise!!</text>
  </svg>
</div>
</body></html>
