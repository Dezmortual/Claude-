<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
<title>Proofcast</title>
<defs>
  <linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="8" y1="26" x2="22" y2="5"><stop offset="0" stop-color="#d6457f"/><stop offset="0.45" stop-color="#8a2f68"/><stop offset="1" stop-color="#4a1439"/></linearGradient>
  <linearGradient id="abg" gradientUnits="userSpaceOnUse" x1="10.5" y1="25" x2="30" y2="8">
    <stop offset="0" stop-color="#e69ac8" stop-opacity="0"/><stop offset=".55" stop-color="#e69ac8" stop-opacity="0.35"/><stop offset="1" stop-color="#e69ac8" stop-opacity="0.122"/></linearGradient>
  <filter id="aglow" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="abandf" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44"><feGaussianBlur stdDeviation=".7"/></filter>
  <linearGradient id="aeg" gradientUnits="userSpaceOnUse" x1="10.5" y1="25" x2="30" y2="8"><stop offset=".15" stop-color="#e69ac8" stop-opacity="0"/><stop offset="1" stop-color="#e69ac8" stop-opacity=".75"/></linearGradient>
  <filter id="alit" filterUnits="userSpaceOnUse" x="-6" y="-6" width="44" height="44" color-interpolation-filters="sRGB">
    <feOffset in="SourceAlpha" dx=".55" dy=".8" result="ho"/>
    <feComposite in="SourceAlpha" in2="ho" operator="out" result="hrim"/>
    <feGaussianBlur in="hrim" stdDeviation=".35" result="hb"/>
    <feFlood flood-color="#ffe2c8" flood-opacity="0.7"/>
    <feComposite in2="hb" operator="in"/>
    <feComposite in2="SourceAlpha" operator="in" result="si"/>
    <feOffset in="SourceAlpha" dx="-.8" dy="-1.1" result="o"/>
    <feComposite in="SourceAlpha" in2="o" operator="out" result="rim"/>
    <feGaussianBlur in="rim" stdDeviation=".45" result="rb"/>
    <feFlood flood-color="#1c0515" flood-opacity="0.3"/>
    <feComposite in2="rb" operator="in"/>
    <feComposite in2="SourceAlpha" operator="in" result="sh"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="db"/>
    <feOffset in="db" dy="1" result="dbo"/>
    <feFlood flood-color="#3d1030" flood-opacity="0.3"/>
    <feComposite in2="dbo" operator="in" result="ds"/>
    <feMerge result="lit"><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="si"/></feMerge>
    <feMerge><feMergeNode in="ds"/><feMergeNode in="lit"/></feMerge>
  </filter>
  <radialGradient id="asp"><stop offset="0" stop-color="#ffd3a8"/><stop offset=".5" stop-color="#e69ac8" stop-opacity=".5"/><stop offset="1" stop-color="#e69ac8" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .line{stroke-dasharray:1 2;animation:pc-draw 1.5s .3s cubic-bezier(.55,0,.25,1) both}
  .band{animation:pc-fade .9s .15s ease-out both}
  .glow{animation:pc-fade .6s 1.5s ease-out both}
  .flash{opacity:0;animation:pc-flash 1s 1.65s ease-out both}
  .spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:pc-spark .9s 1.7s ease-out both}
  @keyframes pc-draw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
  @keyframes pc-fade{from{opacity:0}to{opacity:1}}
  @keyframes pc-flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  @keyframes pc-spark{0%{opacity:0;transform:scale(.3)}35%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
  @media (prefers-reduced-motion:reduce){.line,.band,.glow,.flash,.spark{animation:none}}
</style>
  <g class="band">
    <path d="M10.5 25L28.5 3.5Q31.4 10 30.4 17Z" fill="url(#abg)" filter="url(#abandf)"/>
  </g>
  <!-- result flash and spark: pop when the line completes -->
  <path class="flash" d="M6 19.5L10.5 25L14.5 6H20A6 6 0 0 1 20 18H12" stroke="#ffb3d3" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#aglow)"/>
  <path class="glow" d="M6 19.5L10.5 25L14.5 6H20A6 6 0 0 1 20 18H12" stroke="#e69ac8" stroke-opacity="0.2" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#aglow)"/>
  <g filter="url(#alit)"><path class="line" d="M6 19.5L10.5 25L14.5 6H20A6 6 0 0 1 20 18H12" pathLength="1" stroke="url(#ag)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <circle class="spark" cx="10.5" cy="25" r="2.6" fill="url(#asp)"/>
</svg>
