name: Refresh built-in prices

# Downloads fresh candles into arf-os-studio/platform/data so the Claude app version of the platform
# (which cannot reach outside websites) has up-to-date prices, then redeploys the website.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download prices
        run: node arf-os-studio/platform/tools/fetch-prices.mjs
      - name: Commit
        run: |
          git config user.name "price-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arf-os-studio/platform/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh built-in prices $(date -u +%F)"
          git push
      - name: Redeploy website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
