name: Deploy Agent Desk to GitHub Pages

on:
  push:
    branches: [ccr-3be28ed4-qp59gm]
    paths: ["arf-os-studio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arf-os-studio
      - id: deployment
        uses: actions/deploy-pages@v4
